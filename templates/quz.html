		//let time={{ minutes|default(0) }}*60;
		let time={{minutes}}*60;
		let timer=setInterval(function() {
			let hours=Math.floor(time/3600);
			let minutes=Math.floor((time%3600)/60);
			let seconds=time%60;
			document.getElementById('timer').innerText="Time: "+(hours<10 ? "0"+hours:hours)+":"+(minutes<10 ? "0"+minutes:minutes)+":"+(seconds<10 ? "0"+seconds:seconds);
			time--;

			if (time<0)
			{
				clearInterval(timer);
				document.body.innerHTML="<h3>Time Over<br>Your Score:"+score+"</h3>";
			}
		},1000);
	

		function checkanswer(ans)
		{
			if (questions[current].attempted) return;
			questions[current].attempted= true;
			loadplt();
			let correct=questions[current].answer.toUpperCase();

			if (ans==correct)
			{
				document.getElementById('op'+(["1","2","3","4"].indexOf(ans)+1)).style.background="green";
				score++
			}
			else
			{
				document.getElementById("op"+(["1","2","3","4"].indexOf(ans)+1)).style.background="red";
				score=score-0.25

				document.getElementById('op'+(["1","2","3","4"].indexOf(correct)+1)).style.background="green";
			}

		function nextQuestion()
		{
			if (current<questions.length-1)
			{
				current++;
				loadquestion();
				loadplt();
			}

			/*else
			{

		function previousQuestion()
		{
			if (current>0)
			{
				current--;
				loadquestion();
				loadplt();
			}
		}
		function getstatus()
		{
			let attempted=0;
			let notattempted=0;
			let review=0;
			for (let i=0;i<questions.length;i++)
			{
				if (questions[i].attempted)
				{
					attempted++;
				}
				else
				{
					notattempted++;
				}
				if (questions[i].review)
				{
					review++;
				}
			}
			return{attempted,notattempted,review};
		}
		function submit()
		{
			/*if (current==questions.length-1)
			{
				document.body.innerHTML="<h3>Your Test is Finished....!<br>" +"Your Score Is >>>"+score+"</h3>";
			}
			else
			{
				alert("Please Approach All Question") 
			}*/
			let sts=getstatus();
			let notAttempted=questions.filter(q=>!q.attempted).length;
			if (notAttempted>0)
			{
				let confirmsubmit=confirm(notAttempted+ "questions Are Not Attempted Do You Still Want To Submit The Test?");
				if(confirmsubmit)
				{
					document.body.innerHTML="<h3>Your Test is Finished....!<br> Your Score Is >>>"+score+"</h3><h6><br>Total Attempted Question="+sts.attempted+"<br>Not Attempted="+sts.notattempted+"<br>Mark For Review="+sts.review;"</h6>"
				}
			}
			else
			{
				document.body.innerHTML="<h3>Your Test is Finished....!<br> Your Score Is >>>"+score+"</h3><h6><br>Total Attempted Question="+sts.attempted+"<br>Not Attempted="+sts.notattempted+"<br>Mark For Review="+sts.review;"</h6>";
			}
		}
		function mark()
		{
			questions[current].review=!questions[current].review;
			if (questions[current].review)
			{
				alert("Question Mark For Review");
			}
			else
			{
				alert("Unmarked")
			}
			loadplt();
		}
		function loadplt()
		{
			let plt=document.getElementById("plt");
			plt.innerHTML="";
			for (let i=0 ; i<questions.length; i++)
			{
				let btn= document.createElement("button");
				btn.innerText=i+1;
				btn.onclick=function()
				{
					current = i;
					loadquestion();
					loadplt();
				};
				if (i==current)
				{
					btn.style.background="cyan";
					btn.style.color="black";
				}
				else if(questions[i].review)
				{
					btn.style.background="yellow"
				}
				else if(questions[i].attempted)
				{
					btn.style.background="green";
				}
				else
				{
					btn.style.background="red";
				}
				btn.style.padding="10px";
				btn.style.borderRadius="6px";
				plt.appendChild(btn);
			}
		}
		loadquestion ();
