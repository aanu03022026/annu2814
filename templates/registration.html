<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Registration Page</title>
        <style>
            body{
                background-color: #c7e92fd1;
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;}
            .container{
                background-color: rgb(30, 185, 206);
                padding: 20px;
                border-radius: 5px;
                box-shadow: 2px 3px 10px rgba(225, 133, 4, 0.885);
                width: 90%;
                max-width: 360px;
            }
        </style>
    </head>
    <body>
        <div class="container" align="center" justify-content="center">
            <h1>Registration Page</h1>
            <form action="/register" method="POST">
                <b>Name:&nbsp;</b><input type="text" name="username" placeholder="Enter Your Username" required minlength="10"><br><br>
                <b>Email:&nbsp;</b><input type="email" name="email" placeholder="Enter Your Email" required><br><br>
                <b>Password:&nbsp;</b><input type="password" name="password" placeholder="Enter Your Password" minlength="8" maxlength="20" required><br><br>
                <b>Phone:&nbsp;<select><option>+91</option></select></b><input type="tel" name="phone" placeholder="Enter Your Phone Number" required minlength="10" maxlength="12"><br><br>
                <h1 align="right"><button type="submit" style="background-color: aquamarine;>Register</button></h1>
            </form>
            </div>
            </body>
            </html>
