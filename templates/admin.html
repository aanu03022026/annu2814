<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Admin Page</title>
        <style>
            body{
                background-color: #e56203d1;}
            .container{
                background-color: rgb(195, 9, 236);
                border-radius: 5px;
                box-shadow: 2px 3px 10px rgba(225, 133, 4, 0.885);
                width: 90%;
                max-width: 360px;
            }
        </style>
    </head>
    <body >
    <div align="center" justify-content="center">
        <h1 align="center"> Add Questions</h1>
        <div class="container" align="center" justify-content="center">
        <form action="/addquestion" method="post">
            <label for="subjectname">Subject:</label><br>
            <input type="text" id="subjectname" name="subjectname"><br><br>
            <label for="question">Question:</label><br>
            <input type="text" id="question" name="question"><br><br>
            <label for="option1">Option 1:</label><br>
            <input type="text" id="option1" name="option1"><br><br>
            <label for="option2">Option 2:</label><br>
            <input type="text" id="option2" name="option2"><br><br>
            <label for="option3">Option 3:</label><br>
            <input type="text" id="option3" name="option3"><br><br>
            <label for="option4">Option 4:</label><br>
            <input type="text" id="option4" name="option4"><br><br>
            <label for="answer">Correct Answer (1-4):</label><br>
            <input type="number" id="answer" name="answer" min="1" max="4"><br><br>
            <input type="submit" value="Add Question">
        </form>
        </div>
        </div>
    </body>
</html>
